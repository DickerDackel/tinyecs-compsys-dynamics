[project]
name = "tinyecs-compsys-dynamics"
description = "Dynamics component and system library for tinyecs"
version = "0.0.4"
readme = "README.rst"

authors = [
    { name="Michael Lamertz", email="michael.lamertz@gmail.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: pygame",
]

license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    'aenum',
    'pgcooldown',
    'pyglm',
    'tinyecs >= 0.5.0',
    'tinyecs-compsys',
    'tinyecs-compsys-base',
]

[project.urls]
homepage = "https://github.com/dickerdackel/tinyecs-compsys-dynamics"
bugtracker = "https://github.com/DickerDackel/tinyecs-compsys-dynamics/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
